services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:?ALLOWED_TELEGRAM_IDS is required}
      TEMPLATE_PATH: /app/resources/templates/dkp-agreement_new_logo.pdf
      PDF_FONT_PATH: /usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf
      DEAL_TTL_MINUTES: ${DEAL_TTL_MINUTES:-60}
      OCR_PROVIDER: ${OCR_PROVIDER:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_OCR_MODEL: ${OPENAI_OCR_MODEL:-gpt-5.5}
      OCR_MAX_FILE_BYTES: ${OCR_MAX_FILE_BYTES:-10485760}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-25000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
