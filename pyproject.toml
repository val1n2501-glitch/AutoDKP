[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodkp"
version = "0.1.0"
description = "Local-first Telegram bot for preparing printable vehicle sale agreements"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.28,<4",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "num2words>=0.5.14,<1",
  "openai>=2.26,<3",
  "pillow>=11.3,<13",
  "pydantic>=2.12,<2.14",
  "pydantic-settings>=2.11,<3",
  "pymupdf>=1.28,<2",
  "sqlalchemy>=2.0,<2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
]

[project.scripts]
autodkp = "autodkp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodkp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]

